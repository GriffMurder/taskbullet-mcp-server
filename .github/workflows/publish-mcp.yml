# Publishes @taskbullet/mcp-server to npm, then lists it (and the remote-only
# site MCP) on the official MCP Registry.
#
# Secret required: NPM_TOKEN
#   npm Automation token (or granular token) that can publish @taskbullet/mcp-server.
#   Repository secret, not an environment secret. setup-node reads it as NODE_AUTH_TOKEN.
#
# Registry auth is GitHub Actions OIDC (id-token: write). No MCP token secret.
# The registry namespace must stay io.github.GriffMurder/* because OIDC permissions
# use the repository_owner claim with its exact GitHub casing.
#
# Trigger after package.json and server.json versions match the tag:
#   git tag v0.1.3 && git push origin v0.1.3
#
# server.site.json is published in the same job. Bump its version when that
# file changes. A duplicate site version is ignored so an npm-only tag still
# succeeds.

name: Publish to npm and MCP Registry

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "lts/*"
          registry-url: "https://registry.npmjs.org"

      - name: Require the tag to match the npm server version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG="$(node -p "require('./package.json').version")"
          SRV="$(node -p "require('./server.json').version")"
          PKG_VER="$(node -p "require('./server.json').packages[0].version")"
          NAME="$(node -p "require('./package.json').mcpName")"
          SRV_NAME="$(node -p "require('./server.json').name")"
          if [ "$TAG" != "$PKG" ] || [ "$TAG" != "$SRV" ] || [ "$TAG" != "$PKG_VER" ]; then
            echo "Tag v$TAG does not match package.json ($PKG) and server.json ($SRV / $PKG_VER)."
            exit 1
          fi
          if [ "$NAME" != "$SRV_NAME" ]; then
            echo "package.json mcpName ($NAME) must match server.json name ($SRV_NAME)."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish package to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install mcp-publisher
        run: |
          curl -fsSL -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz"
          tar xzf mcp-publisher.tar.gz mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish npm server to MCP Registry
        run: |
          # npm metadata can lag the publish by a short time; the registry
          # rejects the listing until @taskbullet/mcp-server@<version> is visible.
          for attempt in 1 2 3 4 5 6; do
            if ./mcp-publisher publish server.json; then
              exit 0
            fi
            echo "Registry publish attempt ${attempt} failed; retrying in 20s."
            sleep 20
          done
          exit 1

      - name: Publish site MCP to MCP Registry
        run: |
          set +e
          out="$(./mcp-publisher publish server.site.json 2>&1)"
          code=$?
          set -e
          printf '%s\n' "$out"
          if [ "$code" -eq 0 ]; then
            exit 0
          fi
          # Remote-only metadata is version 1.0.0 and is not bumped with npm releases.
          if printf '%s\n' "$out" | grep -q "cannot publish duplicate version"; then
            echo "Site MCP version is already listed."
            exit 0
          fi
          exit "$code"
